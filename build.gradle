buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm:9.7.1"
    }
}

plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group


base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.meteordev.org" }
    maven {
        url 'https://repo.graalvm.org/release'
    }
    maven { url 'https://maven.maxhenkel.de/repository/public' }
    maven { url "https://repo.viaversion.com" }
    maven { url "https://maven.lenni0451.net/everything" }
    maven { url "https://repo.opencollab.dev/maven-snapshots" }

}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation("net.fabricmc:tiny-mappings-parser:0.3.0+build.17")
    include implementation("org.graalvm.polyglot:polyglot:24.2.1")
    include implementation("org.graalvm.js:js-language:24.2.1")
    include implementation("org.graalvm.truffle:truffle-runtime:24.2.1")
    include implementation("org.graalvm.sdk:collections:25.0.0")
    include implementation("org.graalvm.sdk:nativeimage:25.0.0")
    include implementation("meteordevelopment:discord-ipc:1.1")
    include implementation("meteordevelopment:orbit:0.2.3")
    include implementation('org.java-websocket:Java-WebSocket:1.6.0')
    include implementation("net.java.dev.jna:jna:5.15.0")
    include implementation("net.java.dev.jna:jna-platform:5.15.0")
    implementation("org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1")
    include implementation("com.neovisionaries:nv-websocket-client:2.14")
    include implementation("org.luaj:luaj-jse:3.0.1")
    implementation("org.deeplearning4j:rl4j:1.0.0-M1.1")
    implementation("org.deeplearning4j:rl4j-core:1.0.0-M1.1")
    // https://mvnrepository.com/artifact/org.nd4j/nd4j-native
    testImplementation("org.nd4j:nd4j-native:1.0.0-M2.1")
    implementation("org.nd4j:nd4j-native-platform:1.0.0-M2.1")
    include "org.slf4j:slf4j-simple:2.0.7"
    include implementation("io.netty:netty-handler-proxy:4.1.118.Final")
    include implementation("com.typesafe:config:1.4.3")
    include(implementation('dev.redstones.mediaplayerinfo:media-player-info:0.1.0'))
    annotationProcessor implementation("org.projectlombok:lombok:1.18.30")
    include modImplementation("ai.djl:api:0.32.0")
    include modImplementation("ai.djl.pytorch:pytorch-engine:0.32.0")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}
jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }

}



tasks.matching { it.name == "runClient" || it.name == "generateRemapClasspath" || it.name == "remapJar" }.configureEach {

}

loom {
    accessWidenerPath = file("src/main/resources/topchdlc.accesswidener")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}